[package]
name = "rugdns"
version = "0.1.0"
edition = "2024"

[dependencies]
hickory-server = { version = "0.26.1", features = ["dnssec-aws-lc-rs", "resolver"] }
hickory-resolver = { version = "0.26.1", features = ["https-aws-lc-rs"] }
async-trait = { version = "0.1" }
tokio = { version = "1.21", features = ["net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.22"
regex = "1"
data-encoding = "2"
